[package]
name = "radio-fm"
version = "0.0.7"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
fs2 = "0.4"
libc = "0.2"
gstreamer = "0.24"
quick-xml = "0.41"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
